[project]
name = "comfyui-songlrc"
description = "Timed .lrc lyrics for generated songs, saved beside the audio, with a player that highlights each line as it is sung."
version = "1.1.1"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "soundfile"]

[project.urls]
Repository = "https://github.com/TheAwaken1/ComfyUI-SongLRC"

[tool.comfy]
PublisherId = "theawaken1"
DisplayName = "ComfyUI-SongLRC"
Icon = "https://raw.githubusercontent.com/TheAwaken1/ComfyUI-SongLRC/main/images/icon.png"
Banner = "https://raw.githubusercontent.com/TheAwaken1/ComfyUI-SongLRC/main/images/banner.png"
